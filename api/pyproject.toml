[project]
name = "sage-api"
version = "0.1.0"
description = "SAGE FastAPI backend — native service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.119.0",
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
